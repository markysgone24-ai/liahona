<!DOCTYPE html>

<meta name="description" content="Liahona — a contemplative scripture study companion">
<meta name="theme-color" content="#fdf9f1">
<title>Liahona</title>

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: ['class', '[data-theme="night"]'],
  theme: {
    extend: {
      colors: {
        surface: 'rgb(var(--surface) / <alpha-value>)',
        'surface-dim': 'rgb(var(--surface-dim) / <alpha-value>)',
        'surface-bright': 'rgb(var(--surface-bright) / <alpha-value>)',
        'surface-container-lowest': 'rgb(var(--surface-lowest) / <alpha-value>)',
        'surface-container-low': 'rgb(var(--surface-low) / <alpha-value>)',
        'surface-container': 'rgb(var(--surface-container) / <alpha-value>)',
        'surface-container-high': 'rgb(var(--surface-high) / <alpha-value>)',
        'surface-container-highest': 'rgb(var(--surface-highest) / <alpha-value>)',
        'surface-variant': 'rgb(var(--surface-highest) / <alpha-value>)',
        'on-surface': 'rgb(var(--on-surface) / <alpha-value>)',
        'on-surface-variant': 'rgb(var(--on-surface-variant) / <alpha-value>)',
        'inverse-surface': 'rgb(var(--inverse-surface) / <alpha-value>)',
        'inverse-on-surface': 'rgb(var(--inverse-on-surface) / <alpha-value>)',
        outline: 'rgb(var(--outline) / <alpha-value>)',
        'outline-variant': 'rgb(var(--outline-variant) / <alpha-value>)',
        primary: 'rgb(var(--primary) / <alpha-value>)',
        'on-primary': 'rgb(var(--on-primary) / <alpha-value>)',
        'primary-container': 'rgb(var(--primary-container) / <alpha-value>)',
        'on-primary-container': 'rgb(var(--on-primary-container) / <alpha-value>)',
        secondary: 'rgb(var(--secondary) / <alpha-value>)',
        'on-secondary': 'rgb(var(--on-secondary) / <alpha-value>)',
        'secondary-container': 'rgb(var(--secondary-container) / <alpha-value>)',
        'on-secondary-container': 'rgb(var(--on-secondary-container) / <alpha-value>)',
        error: 'rgb(var(--error) / <alpha-value>)',
        'on-error': 'rgb(var(--on-error) / <alpha-value>)',
        'error-container': 'rgb(var(--error-container) / <alpha-value>)',
        'on-error-container': 'rgb(var(--on-error-container) / <alpha-value>)',
        'surface-tint': 'rgb(var(--surface-tint) / <alpha-value>)',
        accent: 'rgb(var(--accent) / <alpha-value>)',
      },
      borderRadius: { DEFAULT: '0.5rem', lg: '1rem', xl: '1.25rem', '2xl': '1.5rem', full: '9999px' },
      spacing: {
        'space-2xs': '0.25rem', 'space-xs': '0.5rem', 'space-sm': '0.75rem',
        'space-md': '1rem', 'space-lg': '1.5rem', 'space-xl': '2rem',
        'space-2xl': '3rem', 'space-3xl': '4.5rem',
        gutter: '1rem', 'gutter-tablet': '1.5rem', 'gutter-desktop': '2rem',
        margin: '1.25rem', 'margin-tablet': '2.5rem', 'margin-desktop': '4rem',
      },
      fontFamily: {
        'display-lg': ['Merriweather', 'Georgia', 'serif'],
        'display-lg-mobile': ['Merriweather', 'Georgia', 'serif'],
        'headline-lg': ['Merriweather', 'Georgia', 'serif'],
        'headline-md': ['Merriweather', 'Georgia', 'serif'],
        'headline-sm': ['Merriweather', 'Georgia', 'serif'],
        'scripture': ['Merriweather', 'Georgia', 'serif'],
        'scripture-mobile': ['Merriweather', 'Georgia', 'serif'],
        'body-lg': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
        'body-md': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
        'label-lg': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
        'label-md': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
        'verse-number': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
        marginalia: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
      },
      fontSize: {
        'headline-lg': ['24px', { lineHeight: '34px', fontWeight: '400' }],
        'headline-sm': ['18px', { lineHeight: '26px', fontWeight: '700' }],
        'scripture': ['19px', { lineHeight: '1.8', letterSpacing: '0.01em', fontWeight: '300' }],
        'scripture-mobile': ['17px', { lineHeight: '1.78', letterSpacing: '0.01em', fontWeight: '300' }],
        'verse-number': ['11px', { lineHeight: '1', fontWeight: '700' }],
        'display-lg-mobile': ['28px', { lineHeight: '36px', letterSpacing: '-0.01em', fontWeight: '700' }],
        'headline-md': ['20px', { lineHeight: '28px', fontWeight: '700' }],
        marginalia: ['11px', { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '500' }],
        'display-lg': ['34px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '700' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.03em', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '22px', fontWeight: '400' }],
      },
      boxShadow: {
        level1: '0 2px 8px -2px rgb(var(--shadow) / 0.06), 0 1px 3px 0 rgb(var(--shadow) / 0.04)',
        level2: '0 8px 24px -4px rgb(var(--shadow) / 0.10), 0 2px 6px -1px rgb(var(--shadow) / 0.05)',
        level3: '0 -12px 32px -4px rgb(var(--shadow) / 0.14)',
        gold: '0 4px 14px rgb(var(--accent) / 0.25)',
      },
      screens: { xs: '420px' },
    },
  },
};

<link rel="stylesheet" href="src/theme.css">
</head>

<body class="bg-surface text-on-surface font-body-md antialiased min-h-full flex flex-col">

<a href="#view-root" class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:m-2 focus:px-3 focus:py-2 focus:rounded-lg focus:bg-primary focus:text-on-primary">Skip to content</a>

<!-- ============================================================== header -->
<header id="app-header" class="fixed top-0 inset-x-0 z-40 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgb(var(--shadow)/0.05)] transition-all duration-300">
  <div class="h-16 px-margin flex items-center justify-between gap-space-sm">
    <div id="header-lead" class="flex items-center gap-space-sm min-w-0">
      <span class="liahona-logo-wrap shrink-0">
        <span class="liahona-logo-fallback" aria-hidden="true"><span class="material-symbols-outlined text-[22px]">auto_stories</span></span>
        <img alt="Liahona" class="liahona-logo" src="assets/liahona.png" onerror="this.remove()">
      </span>
      <span class="font-headline-sm text-headline-sm text-primary tracking-tight truncate">Liahona</span>
    </div>
    <div id="header-trail" class="flex items-center gap-space-sm shrink-0"></div>
  </div>
  <div id="header-progress" class="h-0.5 w-full bg-transparent transition-colors duration-300">
    <div id="header-progress-bar" class="h-full bg-secondary-container transition-all duration-500" style="width:0%"></div>
  </div>
</header>

<!-- =============================================================== main -->
<main id="view-root" class="flex-1 w-full" tabindex="-1">
  <div id="content-pad" class="px-margin pb-[calc(4.5rem+env(safe-area-inset-bottom,0px))] pt-space-2xs max-w-3xl mx-auto">
    <div class="animate-pulse space-y-4 py-8" aria-label="Loading">
      <div class="h-6 w-1/3 bg-surface-container-highest rounded"></div>
      <div class="h-40 bg-surface-container rounded-xl"></div>
      <div class="h-24 bg-surface-container rounded-xl"></div>
    </div>
  </div>
</main>

<!-- ============================================================== tabbar -->
<nav id="tabbar" class="fixed bottom-0 inset-x-0 z-40 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_16px_rgb(var(--shadow)/0.06)]" aria-label="Primary">
  <div class="h-16 px-space-xs flex items-center justify-around max-w-lg mx-auto">
    <a href="#/" data-tab="home" class="tab-link flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-2xs py-1 transition-colors" aria-current="page">
      <span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-md text-label-md mt-0.5">Home</span>
    </a>
    <a href="#/read" data-tab="read" class="tab-link flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-2xs py-1 transition-colors">
      <span class="material-symbols-outlined text-[24px]">menu_book</span><span class="font-label-md text-label-md mt-0.5">Read</span>
    </a>
    <a href="#/ask" data-tab="ask" class="tab-link flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-2xs py-1 transition-colors">
      <span class="material-symbols-outlined text-[24px]">explore</span><span class="font-label-md text-label-md mt-0.5">Ask AI</span>
    </a>
    <a href="#/library" data-tab="library" class="tab-link flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-2xs py-1 transition-colors">
      <span class="material-symbols-outlined text-[24px]">collections_bookmark</span><span class="font-label-md text-label-md mt-0.5">Library</span>
    </a>
    <a href="#/settings" data-tab="settings" class="tab-link flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-2xs py-1 transition-colors">
      <span class="material-symbols-outlined text-[24px]">tune</span><span class="font-label-md text-label-md mt-0.5">Settings</span>
    </a>
  </div>
</nav>

<!-- ======================================================= overlay roots -->
<div id="sheet-root"></div>
<div id="toast-root" class="fixed inset-x-0 bottom-[calc(4rem+env(safe-area-inset-bottom,0px))] z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none" role="status" aria-live="polite"></div>
<div id="progress-root"></div>
